<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAWALA - AI Meeting Monitoring untuk Zoom &amp; Google Meet</title>
<meta name="description" content="SAWALA memantau meeting kamu secara real-time: deteksi OnCam/OffCam, penggunaan HP, fatigue, dan ekspresi peserta, langsung di dashboard live.">
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#3f3d38;
    --muted:#7a776e;
    --line:#e3ded2;
    --paper:#f7f5f0;
    --paper-alt:#efebe1;
    --card:#fbfaf7;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.5;
    overflow-x:hidden;
  }
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}
  .container{max-width:1200px;margin:0 auto;padding:0 24px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(247,245,240,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    height:68px;
    position:relative;
  }
  .logo{
    display:flex;align-items:center;gap:8px;
    font-weight:700;font-size:22px;letter-spacing:-0.02em;color:var(--ink);
  }
  .logo img{height:28px;width:auto;}
  .nav-links{
    display:flex;align-items:center;gap:28px;
    font-size:14.5px;font-weight:500;color:var(--ink-soft);
  }
  .nav-links a:hover{color:var(--ink);}
  .nav-cta{display:flex;align-items:center;gap:14px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 20px;border-radius:8px;font-weight:600;font-size:14.5px;
    transition:all .15s ease;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-outline{border:1.5px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--ink);}
  .btn-ghost{color:var(--ink-soft);font-weight:500;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-lg{padding:14px 30px;font-size:16px;border-radius:10px;}

  .menu-toggle{
    display:none;flex-direction:column;justify-content:center;gap:5px;
    width:34px;height:34px;
  }
  .menu-toggle span{
    display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;
  }

  @media (max-width:900px){
    .nav-links{
      position:absolute;top:100%;left:0;right:0;
      flex-direction:column;align-items:flex-start;gap:0;
      background:var(--paper);border-bottom:1px solid var(--line);
      max-height:0;overflow:hidden;transition:max-height .25s ease;
    }
    .nav-links.open{max-height:400px;}
    .nav-links a{padding:14px 24px;width:100%;border-bottom:1px solid var(--line);}
    .nav-cta .btn-ghost{display:none;}
    .menu-toggle{display:flex;}
  }

  /* ---------- Hero ---------- */
  .hero{
    padding:56px 0 48px;
    background:var(--paper);
  }
  .hero-grid{
    display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;
  }
  @media (max-width:900px){
    .hero{padding:40px 0 36px;}
    .hero-grid{grid-template-columns:1fr;text-align:center;gap:36px;}
    .hero-cta, .badge{justify-content:center;}
  }
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--paper-alt);color:var(--ink-soft);
    font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;
    margin-bottom:22px;border:1px solid var(--line);
  }
  h1{
    font-size:clamp(30px,5vw,52px);line-height:1.1;letter-spacing:-0.02em;
    font-weight:700;margin-bottom:22px;
  }
  h1 span{color:var(--ink-soft);}
  .hero p.lead{
    font-size:clamp(15px,2vw,18px);color:var(--ink-soft);max-width:520px;margin-bottom:32px;
  }
  @media (max-width:900px){ .hero p.lead{margin-left:auto;margin-right:auto;} }
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .trust-line{font-size:13px;color:var(--muted);}

  .hero-visual{
    position:relative;background:var(--card);border-radius:20px;
    padding:14px;border:1px solid var(--line);
  }
  .hero-visual .toolbar{display:flex;gap:6px;padding:0 6px 12px;}
  .hero-visual .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .hero-visual img{border-radius:10px;}
  .tile-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  }
  @media (max-width:480px){ .tile-grid{grid-template-columns:repeat(2,1fr);} }
  .tile{
    aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden;
    background:var(--paper-alt);border:1px solid var(--line);
    display:flex;align-items:flex-end;padding:8px;
  }
  .tile .tag{
    font-size:10.5px;font-weight:600;color:var(--ink);
    padding:3px 7px;border-radius:6px;background:var(--card);border:1px solid var(--line);
  }
  .tile-face{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:38%;aspect-ratio:1/1;border-radius:50%;
    background:var(--line);
  }

  /* ---------- Logos ---------- */
  .logos-section{padding:32px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .logos-label{text-align:center;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:22px;}
  .logos-row{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;align-items:center;font-weight:700;color:var(--muted);font-size:16px;}

  /* ---------- Section heading ---------- */
  .section{padding:clamp(48px,8vw,88px) 0;}
  .section-head{max-width:640px;margin:0 auto 48px;text-align:center;padding:0 4px;}
  .kicker{color:var(--muted);font-weight:600;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px;}
  h2{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-0.02em;margin-bottom:14px;}
  .section-head p{color:var(--ink-soft);font-size:16px;}

  /* ---------- Features grid ---------- */
  .features{
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  }
  @media (max-width:900px){ .features{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .features{grid-template-columns:1fr;} }
  .card{
    background:var(--card);border-radius:var(--radius);
    padding:28px;transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid var(--line);
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px rgba(26,26,26,.12);}
  .card h3{font-size:18px;font-weight:600;margin-bottom:8px;}
  .card p{color:var(--ink-soft);font-size:14.5px;}

  /* ---------- Split feature ---------- */
  .split{
    display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;
  }
  @media (max-width:900px){
    .split{grid-template-columns:1fr;}
  }
  .split-visual{
    background:var(--card);border-radius:20px;padding:28px;
    border:1px solid var(--line);
  }
  .split-visual img{border-radius:12px;}
  .stat-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .stat-pill{
    flex:1 1 120px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;
  }
  .stat-pill .num{font-size:26px;font-weight:700;color:var(--ink);}
  .stat-pill .lbl{font-size:12.5px;color:var(--muted);font-weight:600;}
  .bar-track{height:8px;background:var(--paper-alt);border-radius:99px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;background:var(--ink-soft);border-radius:99px;}

  .split-copy .kicker{margin-bottom:10px;}
  .split-copy h2{font-size:clamp(24px,3.5vw,30px);margin-bottom:16px;}
  .split-copy p{color:var(--ink-soft);font-size:16px;margin-bottom:22px;}
  .check-list{list-style:none;}
  .check-list li{
    display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:15px;color:var(--ink-soft);
  }
  .check-list li::before{
    content:"";flex-shrink:0;width:6px;height:6px;border-radius:50%;
    background:var(--ink);margin-top:8px;
  }

  /* ---------- Steps ---------- */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  @media (max-width:900px){ .steps{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .steps{grid-template-columns:1fr;} }
  .step{position:relative;padding:28px 20px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
  .step .step-num{
    width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:16px;
  }
  .step h3{font-size:16px;font-weight:600;margin-bottom:6px;}
  .step p{font-size:14px;color:var(--ink-soft);}

  /* ---------- Pricing ---------- */
  .pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:760px;margin:0 auto;}
  @media (max-width:640px){ .pricing-grid{grid-template-columns:1fr;} }
  .plan-card{border-radius:var(--radius);padding:28px;border:1px solid var(--line);}
  .plan-card h3{font-size:18px;margin-bottom:10px;font-weight:600;}
  .plan-card p{font-size:14.5px;margin-bottom:18px;}
  .plan-card .price{font-size:32px;font-weight:700;margin-bottom:18px;}
  .plan-card.light{background:var(--card);}
  .plan-card.light p{color:var(--ink-soft);}
  .plan-card.dark{background:var(--ink);border-color:var(--ink);}
  .plan-card.dark h3, .plan-card.dark .price{color:var(--paper);}
  .plan-card.dark p{color:#cfccc3;}
  .plan-card .btn{width:100%;}
  .plan-card.dark .btn-primary{background:var(--paper);color:var(--ink);}
  .plan-card.dark .btn-primary:hover{background:#e9e6dd;}

  /* ---------- CTA banner ---------- */
  .cta-banner{
    background:var(--ink);
    border-radius:24px;padding:clamp(36px,6vw,64px) clamp(20px,6vw,48px);text-align:center;color:var(--paper);
  }
  .cta-banner h2{color:var(--paper);font-size:clamp(24px,4vw,32px);margin-bottom:12px;}
  .cta-banner p{color:#cfccc3;font-size:16px;margin-bottom:30px;}
  .cta-banner .btn-primary{background:var(--paper);color:var(--ink);}
  .cta-banner .btn-primary:hover{background:#e9e6dd;}
  .cta-banner .btn-outline{border-color:#57544c;color:var(--paper);}
  .cta-banner .btn-outline:hover{border-color:var(--paper);}

  /* ---------- Footer ---------- */
  footer{background:var(--ink);color:#cfccc3;padding:56px 0 28px;}
  .footer-grid{
    display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:32px;margin-bottom:40px;
  }
  @media (max-width:900px){ .footer-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:480px){ .footer-grid{grid-template-columns:1fr;} }
  .footer-grid h4{color:var(--paper);font-size:14px;font-weight:600;margin-bottom:16px;}
  .footer-grid ul{list-style:none;}
  .footer-grid li{margin-bottom:10px;}
  .footer-grid a{font-size:14px;color:#a8a59c;}
  .footer-grid a:hover{color:var(--paper);}
  .footer-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--paper);margin-bottom:14px;}
  .footer-logo img{height:26px;width:auto;}
  .footer-desc{font-size:14px;color:#a8a59c;max-width:280px;}
  .footer-bottom{
    border-top:1px solid #3a382f;padding-top:24px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
    font-size:13px;color:#8f8c82;
  }
  .admin-link{position:fixed;bottom:16px;right:16px;z-index:60;}
  .admin-link a{
    display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);
    font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:999px;
    opacity:.5;
  }
  .admin-link a:hover{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="#" class="logo" id="logo-slot"></a>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="nav-cta">
      <a href="#" class="btn btn-ghost" id="login-link"></a>
      <a href="#coba" class="btn btn-primary" id="cta-link"></a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Buka menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-grid">
    <div>
      <span class="badge" id="hero-badge"></span>
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-lead"></p>
      <div class="hero-cta">
        <a class="btn btn-primary btn-lg" id="hero-primary-cta"></a>
        <a class="btn btn-outline btn-lg" id="hero-secondary-cta"></a>
      </div>
      <p class="trust-line" id="hero-trust"></p>
    </div>

    <div class="hero-visual" id="hero-visual">
      <div class="toolbar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="tile-grid" id="hero-tiles">
        <div class="tile"><div class="tile-face"></div><span class="tag">OnCam</span></div>
        <div class="tile"><span class="tag">OffCam</span></div>
        <div class="tile"><div class="tile-face"></div><span class="tag">HP Terdeteksi</span></div>
        <div class="tile"><div class="tile-face"></div><span class="tag">OnCam</span></div>
        <div class="tile"><div class="tile-face"></div><span class="tag">Fatigue</span></div>
        <div class="tile"><span class="tag">OffCam</span></div>
      </div>
    </div>
  </div>
</section>

<section class="logos-section">
  <div class="container">
    <p class="logos-label" id="logos-label"></p>
    <div class="logos-row" id="logos-row"></div>
  </div>
</section>

<section class="section" id="fitur">
  <div class="container">
    <div class="section-head">
      <p class="kicker" id="features-kicker"></p>
      <h2 id="features-title"></h2>
      <p id="features-subtitle"></p>
    </div>
    <div class="features" id="features-grid"></div>
  </div>
</section>

<section class="section" id="cara-kerja" style="background:var(--paper-alt);">
  <div class="container">
    <div class="section-head">
      <p class="kicker" id="steps-kicker"></p>
      <h2 id="steps-title"></h2>
    </div>
    <div class="steps" id="steps-grid"></div>
  </div>
</section>

<section class="section" id="deteksi">
  <div class="container">
    <div class="split">
      <div class="split-copy">
        <p class="kicker" id="insight-kicker"></p>
        <h2 id="insight-title"></h2>
        <p id="insight-desc"></p>
        <ul class="check-list" id="insight-checklist"></ul>
        <a class="btn btn-primary" id="insight-cta"></a>
      </div>
      <div class="split-visual" id="insight-visual">
        <div class="stat-row">
          <div class="stat-pill">
            <div class="num">86%</div>
            <div class="lbl">OnCam Rate</div>
            <div class="bar-track"><div class="bar-fill" style="width:86%"></div></div>
          </div>
          <div class="stat-pill">
            <div class="num">4</div>
            <div class="lbl">Deteksi HP</div>
            <div class="bar-track"><div class="bar-fill" style="width:35%;"></div></div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-pill">
            <div class="num">12</div>
            <div class="lbl">Peserta Aktif</div>
            <div class="bar-track"><div class="bar-fill" style="width:75%;"></div></div>
          </div>
          <div class="stat-pill">
            <div class="num">3</div>
            <div class="lbl">Sinyal Fatigue</div>
            <div class="bar-track"><div class="bar-fill" style="width:22%;"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section" id="harga" style="background:var(--paper-alt);">
  <div class="container">
    <div class="section-head">
      <p class="kicker" id="pricing-kicker"></p>
      <h2 id="pricing-title"></h2>
      <p id="pricing-subtitle"></p>
    </div>
    <div class="pricing-grid" id="pricing-grid"></div>
  </div>
</section>

<section class="section" id="coba">
  <div class="container">
    <div class="cta-banner">
      <h2 id="ctabanner-title"></h2>
      <p id="ctabanner-subtitle"></p>
      <div class="hero-cta" style="justify-content:center;">
        <a class="btn btn-primary btn-lg" id="ctabanner-primary"></a>
        <a class="btn btn-outline btn-lg" id="ctabanner-secondary"></a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-grid" id="footer-grid"></div>
    <div class="footer-bottom">
      <span id="footer-copyright"></span>
      <span id="footer-tagline"></span>
    </div>
  </div>
</footer>

<div class="admin-link"><a href="admin.html">Site Settings</a></div>

<script src="js/config.js"></script>
<script>
(function(){
  const cfg = sawalaLoadConfig();
  const el = (id) => document.getElementById(id);
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Brand / nav
  const logoSlot = el("logo-slot");
  logoSlot.innerHTML = cfg.brand.logoImage
    ? `<img src="${cfg.brand.logoImage}" alt="${escapeHtml(cfg.brand.name)}">`
    : escapeHtml(cfg.brand.name);

  const navLinks = el("nav-links");
  navLinks.innerHTML = cfg.nav.links.map(l => `<a href="${escapeHtml(l.href)}">${escapeHtml(l.label)}</a>`).join("");

  const loginLink = el("login-link");
  loginLink.textContent = cfg.nav.loginLabel;
  loginLink.href = cfg.nav.loginHref || "/app/";
  const ctaLink = el("cta-link");
  ctaLink.textContent = cfg.nav.ctaLabel;
  ctaLink.href = cfg.nav.ctaHref;

  const menuToggle = el("menu-toggle");
  menuToggle.addEventListener("click", () => navLinks.classList.toggle("open"));
  navLinks.addEventListener("click", (e) => { if (e.target.tagName === "A") navLinks.classList.remove("open"); });

  // Hero
  el("hero-badge").textContent = cfg.hero.badge;
  el("hero-title").innerHTML = `${escapeHtml(cfg.hero.titleBefore)}<span>${escapeHtml(cfg.hero.titleHighlight)}</span>`;
  el("hero-lead").textContent = cfg.hero.lead;
  const heroPrimary = el("hero-primary-cta");
  heroPrimary.textContent = cfg.hero.primaryCtaLabel; heroPrimary.href = cfg.hero.primaryCtaHref;
  const heroSecondary = el("hero-secondary-cta");
  heroSecondary.textContent = cfg.hero.secondaryCtaLabel; heroSecondary.href = cfg.hero.secondaryCtaHref;
  el("hero-trust").textContent = cfg.hero.trustLine;
  if (cfg.hero.image) {
    el("hero-tiles").outerHTML = `<img src="${cfg.hero.image}" alt="Preview dashboard SAWALA">`;
  }

  // Logos
  el("logos-label").textContent = cfg.logos.label;
  el("logos-row").innerHTML = cfg.logos.items.map(i => `<span>${escapeHtml(i)}</span>`).join("");

  // Features
  el("features-kicker").textContent = cfg.features.kicker;
  el("features-title").textContent = cfg.features.title;
  el("features-subtitle").textContent = cfg.features.subtitle;
  el("features-grid").innerHTML = cfg.features.items.map(f => `
    <div class="card">
      <h3>${escapeHtml(f.title)}</h3>
      <p>${escapeHtml(f.desc)}</p>
    </div>`).join("");

  // Steps
  el("steps-kicker").textContent = cfg.steps.kicker;
  el("steps-title").textContent = cfg.steps.title;
  el("steps-grid").innerHTML = cfg.steps.items.map((s, i) => `
    <div class="step">
      <div class="step-num">${i + 1}</div>
      <h3>${escapeHtml(s.title)}</h3>
      <p>${escapeHtml(s.desc)}</p>
    </div>`).join("");

  // Insight
  el("insight-kicker").textContent = cfg.insight.kicker;
  el("insight-title").textContent = cfg.insight.title;
  el("insight-desc").textContent = cfg.insight.desc;
  el("insight-checklist").innerHTML = cfg.insight.checklist.map(c => `<li>${escapeHtml(c)}</li>`).join("");
  const insightCta = el("insight-cta");
  insightCta.textContent = cfg.insight.ctaLabel; insightCta.href = cfg.insight.ctaHref;
  if (cfg.insight.image) {
    el("insight-visual").innerHTML = `<img src="${cfg.insight.image}" alt="Insight dashboard SAWALA">`;
  }

  // Pricing
  el("pricing-kicker").textContent = cfg.pricing.kicker;
  el("pricing-title").textContent = cfg.pricing.title;
  el("pricing-subtitle").textContent = cfg.pricing.subtitle;
  el("pricing-grid").innerHTML = cfg.pricing.plans.map(p => `
    <div class="plan-card ${p.dark ? "dark" : "light"}">
      <h3>${escapeHtml(p.name)}</h3>
      <p>${escapeHtml(p.desc)}</p>
      <div class="price">${escapeHtml(p.price)}</div>
      <a class="btn ${p.dark ? "btn-primary" : "btn-outline"}" href="${escapeHtml(p.ctaHref)}">${escapeHtml(p.ctaLabel)}</a>
    </div>`).join("");

  // CTA banner
  el("ctabanner-title").textContent = cfg.ctaBanner.title;
  el("ctabanner-subtitle").textContent = cfg.ctaBanner.subtitle;
  const ctaP = el("ctabanner-primary"); ctaP.textContent = cfg.ctaBanner.primaryLabel; ctaP.href = cfg.ctaBanner.primaryHref;
  const ctaS = el("ctabanner-secondary"); ctaS.textContent = cfg.ctaBanner.secondaryLabel; ctaS.href = cfg.ctaBanner.secondaryHref;

  // Footer
  const footerCols = cfg.footer.columns.map(col => `
    <div>
      <h4>${escapeHtml(col.title)}</h4>
      <ul>${col.links.map(l => `<li><a href="${escapeHtml(l.href)}">${escapeHtml(l.label)}</a></li>`).join("")}</ul>
    </div>`).join("");
  el("footer-grid").innerHTML = `
    <div>
      <div class="footer-logo">${cfg.brand.logoImage ? `<img src="${cfg.brand.logoImage}" alt="${escapeHtml(cfg.brand.name)}">` : escapeHtml(cfg.brand.name)}</div>
      <p class="footer-desc">${escapeHtml(cfg.footer.description)}</p>
    </div>
    ${footerCols}`;
  el("footer-copyright").textContent = cfg.footer.copyright;
  el("footer-tagline").textContent = cfg.footer.tagline;
})();
</script>

</body>
</html>
